services:
  web:
    build:
      context: .
      dockerfile: Dockerfile
    container_name: mengart_web
    restart: unless-stopped
    ports:
      - "3000:3000"
    environment:
      - NODE_ENV=production
      - DATABASE_URL=postgresql://${POSTGRES_USER:-mengart}:${POSTGRES_PASSWORD:-mengart_dev_pass}@postgres:5432/${POSTGRES_DB:-mengart_db}
      - REDIS_URL=redis://redis:6379
      - AUTH_SECRET=${AUTH_SECRET:-mengart_production_secret_key_at_least_32_characters_long}
      - NEXTAUTH_URL=${NEXTAUTH_URL:-http://localhost:3000}
      - STORAGE_ROOT_DIR=/app/storage
    volumes:
      - media_storage:/app/storage
    depends_on:
      postgres:
        condition: service_healthy
      redis:
        condition: service_healthy
    healthcheck:
      test: ["CMD", "wget", "--no-verbose", "--tries=1", "--spider", "http://localhost:3000/api/health/liveness"]
      interval: 15s
      timeout: 5s
      retries: 3
      start_period: 15s

  worker:
    build:
      context: .
      dockerfile: Dockerfile
    container_name: mengart_media_worker
    restart: unless-stopped
    command: ["npm", "run", "worker"]
    environment:
      - NODE_ENV=production
      - DATABASE_URL=postgresql://${POSTGRES_USER:-mengart}:${POSTGRES_PASSWORD:-mengart_dev_pass}@postgres:5432/${POSTGRES_DB:-mengart_db}
      - REDIS_URL=redis://redis:6379
      - STORAGE_ROOT_DIR=/app/storage
    volumes:
      - media_storage:/app/storage
    depends_on:
      postgres:
        condition: service_healthy
      redis:
        condition: service_healthy

  postgres:
    image: postgres:16-alpine
    container_name: mengart_postgres
    restart: unless-stopped
    environment:
      POSTGRES_USER: ${POSTGRES_USER:-mengart}
      POSTGRES_PASSWORD: ${POSTGRES_PASSWORD:-mengart_dev_pass}
      POSTGRES_DB: ${POSTGRES_DB:-mengart_db}
    ports:
      - "${POSTGRES_PORT:-5433}:5432"
    volumes:
      - postgres_data:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U ${POSTGRES_USER:-mengart} -d ${POSTGRES_DB:-mengart_db}"]
      interval: 5s
      timeout: 5s
      retries: 5

  redis:
    image: redis:7-alpine
    container_name: mengart_redis
    restart: unless-stopped
    command: redis-server --appendonly yes
    ports:
      - "${REDIS_PORT:-6379}:6379"
    volumes:
      - redis_data:/data
    healthcheck:
      test: ["CMD", "redis-cli", "ping"]
      interval: 5s
      timeout: 5s
      retries: 5

volumes:
  postgres_data:
  redis_data:
  media_storage:
